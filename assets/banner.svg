<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="t d">
  <title id="t">Ali Tleis — Web Application Developer (AI Integration) at MIT Lincoln Laboratory</title>
  <desc id="d">A CRT terminal banner reading ALI TLEIS with a scanline sweep and chromatic split.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
      .chip { font-size: 13px; letter-spacing: 3px; }

      /* Chromatic split: idle most of the cycle, then two fast stepped kicks. */
      @keyframes kickR { 0%,88%,100% { transform: translate(0,0) } 90% { transform: translate(4px,-1px) } 94% { transform: translate(-3px,1px) } }
      @keyframes kickB { 0%,88%,100% { transform: translate(0,0) } 90% { transform: translate(-4px,1px) } 94% { transform: translate(3px,-1px) } }
      @keyframes slice  { 0%,86%,100% { opacity: 0 } 91% { opacity: .85 } }
      @keyframes sweep  { 0% { transform: translateY(-70px) } 100% { transform: translateY(260px) } }
      @keyframes blink  { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes pulse  { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

      .r     { animation: kickR 7s steps(1,end) infinite }
      .b     { animation: kickB 7s steps(1,end) infinite }
      .slice { animation: slice 7s steps(1,end) infinite }
      .sweep { animation: sweep 5.5s linear infinite }
      .cur   { animation: blink 1.1s steps(1,end) infinite }
      .dot   { animation: pulse 1.6s ease-in-out infinite }

      @media (prefers-reduced-motion: reduce) {
        .r, .b, .slice, .sweep, .cur, .dot { animation: none }
        .slice { opacity: 0 }
      }
    </style>

    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".55"/>
    </pattern>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-width=".5" opacity=".07"/>
    </pattern>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff2e88" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#ff2e88" stop-opacity=".9"/>
      <stop offset="65%"  stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>

    <clipPath id="band"><rect x="0" y="99" width="1000" height="15"/></clipPath>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="258" rx="10"/></clipPath>
  </defs>

  <rect width="1000" height="260" rx="11" fill="#05070a"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <g clip-path="url(#frame)">
    <!-- Wordmark: magenta and cyan ghosts under a white core. -->
    <g class="mono" text-anchor="middle" font-size="78" font-weight="700" letter-spacing="9">
      <text class="r" x="500" y="132" fill="#ff2e88" opacity=".85">ALI TLEIS</text>
      <text class="b" x="500" y="132" fill="#22d3ee" opacity=".85">ALI TLEIS</text>
      <text        x="500" y="132" fill="#e8f4f8">ALI TLEIS</text>
      <!-- Torn-scanline slice that only appears during the glitch kick. -->
      <text class="slice" x="504" y="132" fill="#e8f4f8" clip-path="url(#band)">ALI TLEIS</text>
    </g>

    <rect class="sweep" x="0" y="0" width="1000" height="70" fill="url(#beam)"/>
    <rect width="1000" height="260" fill="url(#scan)" opacity=".38"/>
    <rect width="1000" height="260" fill="url(#vig)"/>
  </g>

  <rect x="250" y="150" width="500" height="1.5" fill="url(#rule)"/>

  <g class="mono chip">
    <text x="34" y="36" fill="#22d3ee">ALITLEIS.EXE</text>
    <text x="966" y="36" fill="#22d3ee" text-anchor="end">SYS://ONLINE</text>
    <text x="34" y="234" fill="#ff2e88">LOC: BOSTON.MA</text>
    <text x="966" y="234" fill="#ffd23f" text-anchor="end">BUILD//2028</text>
  </g>
  <circle class="dot" cx="979" cy="31" r="4" fill="#22d3ee"/>

  <g class="mono" font-size="17" letter-spacing="4.5" text-anchor="middle">
    <text x="500" y="186" fill="#e8f4f8">
      <tspan fill="#22d3ee">&gt; </tspan><tspan fill="#ffd23f">WEB APP DEV (AI)</tspan> :: MIT LINCOLN LAB<tspan class="cur" fill="#22d3ee"> _</tspan>
    </text>
  </g>

  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity=".8">
    <path d="M16 44V16h30M984 44V16h-30M16 216v28h30M984 216v28h-30"/>
  </g>
  <rect x=".75" y=".75" width="998.5" height="258.5" rx="11" fill="none" stroke="#22d3ee" stroke-opacity=".28"/>
</svg>
