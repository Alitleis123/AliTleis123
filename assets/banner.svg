<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" role="img" aria-labelledby="bt bd">
  <title id="bt">Ali Tleis, Web Application Developer (AI Integration), MIT Lincoln Laboratory, Boston MA</title>
  <desc id="bd">An edit-suite header panel with a level meter and a scrubbing playhead.</desc>

  <defs>
    <style>
      .s { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .n { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }

      @keyframes scrub { 0% { transform: translateX(0) } 100% { transform: translateX(628px) } }
      @keyframes rec   { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
      @keyframes lvl   { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }

      .head { animation: scrub 9s cubic-bezier(.65,0,.35,1) infinite alternate }
      .rec  { animation: rec 1.4s ease-in-out infinite }
      .bar  { transform-box: fill-box; transform-origin: 50% 100%; animation: lvl 1.9s ease-in-out infinite }

      @media (prefers-reduced-motion: reduce) { .head, .rec, .bar { animation: none } }
    </style>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2a33c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f2a33c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="760" height="170" rx="12" fill="#0c1014"/>
  <rect x=".5" y=".5" width="759" height="169" rx="12" fill="none" stroke="#232b36"/>

  <!-- meta strip -->
  <g class="s" font-size="12" letter-spacing="2.5" fill="#6b7a8c">
    <text x="32" y="30">TIMELINE // ALI-TLEIS</text>
    <text x="728" y="30" text-anchor="end" fill="#f0567a">REC</text>
  </g>
  <circle class="rec" cx="685" cy="25.8" r="4" fill="#f0567a"/>

  <!-- identity, left-aligned -->
  <text class="n" x="32" y="86" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-1">Ali Tleis</text>
  <text class="s" x="34" y="112" font-size="14" letter-spacing="1.2" fill="#f2a33c">WEB APP DEVELOPER (AI) &#183; MIT LINCOLN LABORATORY</text>
  <text class="s" x="34" y="133" font-size="12.5" letter-spacing="1" fill="#6b7a8c">NORTHEASTERN CS + SOCIOLOGY &#8217;28 &#183; BOSTON, MA</text>

  <!-- level meter -->
  <g fill="#35d0ba">
    <rect class="bar" x="591" y="66" width="5" height="36" rx="2.5" style="animation-delay:-.1s"/>
    <rect class="bar" x="603" y="66" width="5" height="36" rx="2.5" style="animation-delay:-.9s"/>
    <rect class="bar" x="615" y="66" width="5" height="36" rx="2.5" style="animation-delay:-.4s"/>
    <rect class="bar" x="627" y="66" width="5" height="36" rx="2.5" style="animation-delay:-1.5s"/>
    <rect class="bar" x="639" y="66" width="5" height="36" rx="2.5" style="animation-delay:-.7s"/>
    <rect class="bar" x="651" y="66" width="5" height="36" rx="2.5" style="animation-delay:-1.2s"/>
    <rect class="bar" x="663" y="66" width="5" height="36" rx="2.5" style="animation-delay:-.2s"/>
    <rect class="bar" x="675" y="66" width="5" height="36" rx="2.5" style="animation-delay:-1.7s"/>
    <rect class="bar" x="687" y="66" width="5" height="36" rx="2.5" style="animation-delay:-.55s"/>
    <rect class="bar" x="699" y="66" width="5" height="36" rx="2.5" style="animation-delay:-1.1s"/>
    <rect class="bar" x="711" y="66" width="5" height="36" rx="2.5" style="animation-delay:-.35s"/>
    <rect class="bar" x="723" y="66" width="5" height="36" rx="2.5" style="animation-delay:-1.9s"/>
  </g>

  <!-- scrubber -->
  <rect x="32" y="150" width="696" height="2" rx="1" fill="#232b36"/>
  <g fill="#39434f">
    <rect x="32"  y="143" width="1.5" height="8"/><rect x="119" y="146" width="1.5" height="5"/>
    <rect x="206" y="143" width="1.5" height="8"/><rect x="293" y="146" width="1.5" height="5"/>
    <rect x="380" y="143" width="1.5" height="8"/><rect x="467" y="146" width="1.5" height="5"/>
    <rect x="554" y="143" width="1.5" height="8"/><rect x="641" y="146" width="1.5" height="5"/>
    <rect x="727" y="143" width="1.5" height="8"/>
  </g>
  <g class="head">
    <rect x="32" y="136" width="68" height="16" rx="3" fill="url(#fill)"/>
    <rect x="31" y="136" width="2.5" height="22" rx="1.25" fill="#f2a33c"/>
    <path d="M26 136h13l-6.5 8z" fill="#f2a33c"/>
  </g>
</svg>
