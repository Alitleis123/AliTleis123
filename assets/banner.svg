<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-labelledby="bt bd">
  <title id="bt">Ali Tleis, Web Application Developer (AI Integration), MIT Lincoln Laboratory, Boston MA</title>
  <desc id="bd">An edit-suite header panel with a level meter and a scrubbing playhead.</desc>

  <defs>
    <style>
      .s { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .n { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }

      @keyframes scrub { 0% { transform: translateX(0) } 100% { transform: translateX(852px) } }
      @keyframes rec   { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
      @keyframes lvl   { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }

      .head { animation: scrub 9s cubic-bezier(.65,0,.35,1) infinite alternate }
      .rec  { animation: rec 1.4s ease-in-out infinite }
      .bar  { transform-box: fill-box; transform-origin: 50% 100%; animation: lvl 1.9s ease-in-out infinite }

      @media (prefers-reduced-motion: reduce) { .head, .rec, .bar { animation: none } }
    </style>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2a33c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f2a33c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="210" rx="12" fill="#0c1014"/>
  <rect x=".5" y=".5" width="999" height="209" rx="12" fill="none" stroke="#232b36"/>

  <!-- meta strip -->
  <g class="s" font-size="11" letter-spacing="2.5" fill="#6b7a8c">
    <text x="40" y="36">TIMELINE // ALI-TLEIS</text>
    <text x="960" y="36" text-anchor="end" fill="#f0567a">REC</text>
  </g>
  <circle class="rec" cx="905" cy="32" r="4" fill="#f0567a"/>

  <!-- identity, left-aligned -->
  <text class="n" x="40" y="105" font-size="54" font-weight="700" fill="#e6edf3" letter-spacing="-1">Ali Tleis</text>
  <text class="s" x="42" y="134" font-size="14" letter-spacing="1.5" fill="#f2a33c">WEB APPLICATION DEVELOPER &#183; AI INTEGRATION</text>
  <text class="s" x="42" y="156" font-size="12.5" letter-spacing="1.2" fill="#6b7a8c">MIT LINCOLN LABORATORY MIT LINCOLN LABORATORY &#183; BOSTON, MA &#183; NORTHEASTERN &#8217;28#183; NORTHEASTERN CS + SOCIOLOGY MIT LINCOLN LABORATORY &#183; BOSTON, MA &#183; NORTHEASTERN &#8217;28#8217;28 MIT LINCOLN LABORATORY &#183; BOSTON, MA &#183; NORTHEASTERN &#8217;28#183; BOSTON, MA</text>

  <!-- level meter -->
  <g fill="#35d0ba">
    <rect class="bar" x="792" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.1s"/>
    <rect class="bar" x="804" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.9s"/>
    <rect class="bar" x="816" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.4s"/>
    <rect class="bar" x="828" y="86" width="5" height="46" rx="2.5" style="animation-delay:-1.5s"/>
    <rect class="bar" x="840" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.7s"/>
    <rect class="bar" x="852" y="86" width="5" height="46" rx="2.5" style="animation-delay:-1.2s"/>
    <rect class="bar" x="864" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.2s"/>
    <rect class="bar" x="876" y="86" width="5" height="46" rx="2.5" style="animation-delay:-1.7s"/>
    <rect class="bar" x="888" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.55s"/>
    <rect class="bar" x="900" y="86" width="5" height="46" rx="2.5" style="animation-delay:-1.1s"/>
    <rect class="bar" x="912" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.35s"/>
    <rect class="bar" x="924" y="86" width="5" height="46" rx="2.5" style="animation-delay:-1.9s"/>
    <rect class="bar" x="936" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.8s"/>
    <rect class="bar" x="948" y="86" width="5" height="46" rx="2.5" style="animation-delay:-1.35s"/>
    <rect class="bar" x="960" y="86" width="5" height="46" rx="2.5" style="animation-delay:-.05s"/>
  </g>

  <!-- scrubber -->
  <rect x="40" y="180" width="920" height="2" rx="1" fill="#232b36"/>
  <g fill="#39434f">
    <rect x="40"  y="172" width="1.5" height="9"/><rect x="155" y="175" width="1.5" height="6"/>
    <rect x="270" y="172" width="1.5" height="9"/><rect x="385" y="175" width="1.5" height="6"/>
    <rect x="500" y="172" width="1.5" height="9"/><rect x="615" y="175" width="1.5" height="6"/>
    <rect x="730" y="172" width="1.5" height="9"/><rect x="845" y="175" width="1.5" height="6"/>
    <rect x="959" y="172" width="1.5" height="9"/>
  </g>
  <g class="head">
    <rect x="40" y="164" width="68" height="18" rx="3" fill="url(#fill)"/>
    <rect x="39" y="164" width="2.5" height="24" rx="1.25" fill="#f2a33c"/>
    <path d="M34 164h13l-6.5 8z" fill="#f2a33c"/>
  </g>
</svg>
