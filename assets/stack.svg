<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 296" width="1000" height="296" role="img" aria-labelledby="st sd">
  <title id="st">Tech stack, arranged as editor track layers</title>
  <desc id="sd">Interface: TypeScript, React, Next.js. Services: Node.js, Python, C#. Data: PostgreSQL, MongoDB. Media and computer vision: OpenCV, FFmpeg, Lua. Infrastructure: Docker, GitHub Actions.</desc>

  <defs>
    <style>
      .s { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      @keyframes pass { 0% { transform: translateX(-140px) } 55%,100% { transform: translateX(1000px) } }
      .pz { animation: pass 6s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) { .pz { animation: none; opacity: 0 } }
    </style>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="film" width="14" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="15" width="6" height="10" rx="1.5" fill="#fff" opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1000" height="296" rx="12" fill="#0c1014"/>
  <rect x=".5" y=".5" width="999" height="295" rx="12" fill="none" stroke="#232b36"/>
  <text class="s" x="28" y="30" font-size="11" letter-spacing="2.5" fill="#6b7a8c">TRACK LAYERS // STACK</text>
  <text class="s" x="972" y="30" font-size="11" letter-spacing="2.5" fill="#3d4854" text-anchor="end">5 TRACKS &#183; LOCKED</text>
  <g>
    <rect x="28" y="46" width="944" height="40" rx="5" fill="#f2a33c" fill-opacity=".10"/>
    <rect x="28" y="46" width="944" height="40" rx="5" fill="url(#film)"/>
    <rect x="28" y="46" width="944" height="40" rx="5" fill="none" stroke="#f2a33c" stroke-opacity=".38"/>
    <rect x="28" y="46" width="4" height="40" fill="#f2a33c"/>
    <text class="s" x="48" y="70.5" font-size="10.5" fill="#3d4854">V4</text>
    <text class="s" x="80" y="70.5" font-size="12" letter-spacing="1.6" fill="#f2a33c">INTERFACE</text>
    <text class="s" x="212" y="70.5" font-size="13" fill="#cfd9e3">TypeScript  ·  React  ·  Next.js</text>
  </g>
  <g>
    <rect x="28" y="96" width="944" height="40" rx="5" fill="#35d0ba" fill-opacity=".10"/>
    <rect x="28" y="96" width="944" height="40" rx="5" fill="url(#film)"/>
    <rect x="28" y="96" width="944" height="40" rx="5" fill="none" stroke="#35d0ba" stroke-opacity=".38"/>
    <rect x="28" y="96" width="4" height="40" fill="#35d0ba"/>
    <text class="s" x="48" y="120.5" font-size="10.5" fill="#3d4854">V3</text>
    <text class="s" x="80" y="120.5" font-size="12" letter-spacing="1.6" fill="#35d0ba">SERVICES</text>
    <text class="s" x="212" y="120.5" font-size="13" fill="#cfd9e3">Node.js  ·  Python  ·  C#</text>
  </g>
  <g>
    <rect x="28" y="146" width="944" height="40" rx="5" fill="#7aa2f7" fill-opacity=".10"/>
    <rect x="28" y="146" width="944" height="40" rx="5" fill="url(#film)"/>
    <rect x="28" y="146" width="944" height="40" rx="5" fill="none" stroke="#7aa2f7" stroke-opacity=".38"/>
    <rect x="28" y="146" width="4" height="40" fill="#7aa2f7"/>
    <text class="s" x="48" y="170.5" font-size="10.5" fill="#3d4854">V2</text>
    <text class="s" x="80" y="170.5" font-size="12" letter-spacing="1.6" fill="#7aa2f7">DATA</text>
    <text class="s" x="212" y="170.5" font-size="13" fill="#cfd9e3">PostgreSQL  ·  MongoDB</text>
  </g>
  <g>
    <rect x="28" y="196" width="944" height="40" rx="5" fill="#f0567a" fill-opacity=".10"/>
    <rect x="28" y="196" width="944" height="40" rx="5" fill="url(#film)"/>
    <rect x="28" y="196" width="944" height="40" rx="5" fill="none" stroke="#f0567a" stroke-opacity=".38"/>
    <rect x="28" y="196" width="4" height="40" fill="#f0567a"/>
    <text class="s" x="48" y="220.5" font-size="10.5" fill="#3d4854">V1</text>
    <text class="s" x="80" y="220.5" font-size="12" letter-spacing="1.6" fill="#f0567a">MEDIA·CV</text>
    <text class="s" x="212" y="220.5" font-size="13" fill="#cfd9e3">OpenCV  ·  FFmpeg  ·  Lua</text>
  </g>
  <g>
    <rect x="28" y="246" width="944" height="40" rx="5" fill="#a78bfa" fill-opacity=".10"/>
    <rect x="28" y="246" width="944" height="40" rx="5" fill="url(#film)"/>
    <rect x="28" y="246" width="944" height="40" rx="5" fill="none" stroke="#a78bfa" stroke-opacity=".38"/>
    <rect x="28" y="246" width="4" height="40" fill="#a78bfa"/>
    <text class="s" x="48" y="270.5" font-size="10.5" fill="#3d4854">A1</text>
    <text class="s" x="80" y="270.5" font-size="12" letter-spacing="1.6" fill="#a78bfa">INFRA</text>
    <text class="s" x="212" y="270.5" font-size="13" fill="#cfd9e3">Docker  ·  GitHub Actions</text>
  </g>
  <g clip-path="inset(0 round 12px)"><rect class="pz" x="0" y="0" width="140" height="296" fill="url(#pg)"/></g>
</svg>
