<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 334" width="1000" height="334" role="img" aria-labelledby="st sd">
  <title id="st">Tech stack, arranged as editor track layers</title>
  <desc id="sd">LANGUAGES: Java, Python, TypeScript, JavaScript, C#, Candand, Kotlin, Lua, SQL, PowerShell. FRONTEND: React, Next.js, Tailwind CSS, Framer Motion, Vite, React Router. BACKEND: Node.js/Express, REST APIs, JWT Auth, Docker, Fly.io, Heroku. DATA and SEARCH: PostgreSQL, MySQL, MongoDB, Apache Solr, Norconex. AI and ML: LLM Integration, Gemini API, DeepSeek, Open-Weight LLMs. TOOLS: OpenCV, FFmpeg, Git/GitHub, Jest, JUnit, Boomi, Jira, Linux, Arduino.</desc>

  <defs>
    <style>
      .s { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      @keyframes pass { 0% { transform: translateX(-140px) } 55%,100% { transform: translateX(1000px) } }
      .pz { animation: pass 6s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) { .pz { animation: none; opacity: 0 } }
    </style>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="film" width="14" height="38" patternUnits="userSpaceOnUse">
      <rect x="0" y="14" width="6" height="10" rx="1.5" fill="#fff" opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1000" height="334" rx="12" fill="#0c1014"/>
  <rect x=".5" y=".5" width="999" height="333" rx="12" fill="none" stroke="#232b36"/>
  <text class="s" x="28" y="30" font-size="11" letter-spacing="2.5" fill="#6b7a8c">TRACK LAYERS // STACK</text>
  <text class="s" x="972" y="30" font-size="11" letter-spacing="2.5" fill="#3d4854" text-anchor="end">6 TRACKS &#183; LOCKED</text>
