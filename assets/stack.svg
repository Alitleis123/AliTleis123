<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="st sd">
  <title id="st">Tech stack, arranged as editor track layers</title>
  <desc id="sd">AI and ML: LLM integration, Gemini API, open-weight LLMs. DATA and SEARCH: Apache Solr, Norconex, PostgreSQL, MongoDB. BACKEND: Node.js/Express, REST APIs, Docker. FRONTEND: React, Next.js, Tailwind CSS. LANGUAGES: Java, Python, TypeScript, C++, SQL. TOOLS: Git, Linux, OpenCV, FFmpeg.</desc>

  <defs>
    <style>
      .s { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      @keyframes pass { 0% { transform: translateX(-140px) } 55%,100% { transform: translateX(760px) } }
      .pz { animation: pass 6s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) { .pz { animation: none; opacity: 0 } }
    </style>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="film" width="14" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="15" width="6" height="10" rx="1.5" fill="#fff" opacity=".045"/>
    </pattern>
  </defs>

  <rect width="760" height="344" rx="12" fill="#0c1014"/>
  <rect x=".5" y=".5" width="759" height="343" rx="12" fill="none" stroke="#232b36"/>
  <text class="s" x="24" y="32" font-size="13" letter-spacing="2.5" fill="#6b7a8c">TRACK LAYERS // STACK</text>
  <text class="s" x="736" y="32" font-size="13" letter-spacing="2.5" fill="#3d4854" text-anchor="end">6 TRACKS &#183; LOCKED</text>

  <g>
    <rect x="24" y="48" width="712" height="40" rx="5" fill="#f0567a" fill-opacity=".10"/>
    <rect x="24" y="48" width="712" height="40" rx="5" fill="url(#film)"/>
    <rect x="24" y="48" width="712" height="40" rx="5" fill="none" stroke="#f0567a" stroke-opacity=".38"/>
    <rect x="24" y="48" width="4" height="40" fill="#f0567a"/>
    <text class="s" x="40" y="73" font-size="12" fill="#3d4854">V5</text>
    <text class="s" x="72" y="73" font-size="14" letter-spacing="1.3" fill="#f0567a">AI + ML</text>
    <text class="s" x="216" y="73" font-size="14.5" fill="#cfd9e3">LLM Integration &#183; Gemini API &#183; Open-Weight LLMs</text>
  </g>
  <g>
    <rect x="24" y="96" width="712" height="40" rx="5" fill="#a78bfa" fill-opacity=".10"/>
    <rect x="24" y="96" width="712" height="40" rx="5" fill="url(#film)"/>
    <rect x="24" y="96" width="712" height="40" rx="5" fill="none" stroke="#a78bfa" stroke-opacity=".38"/>
    <rect x="24" y="96" width="4" height="40" fill="#a78bfa"/>
    <text class="s" x="40" y="121" font-size="12" fill="#3d4854">V4</text>
    <text class="s" x="72" y="121" font-size="14" letter-spacing="1.3" fill="#a78bfa">DATA + SEARCH</text>
    <text class="s" x="216" y="121" font-size="14.5" fill="#cfd9e3">Apache Solr &#183; Norconex &#183; PostgreSQL &#183; MongoDB</text>
  </g>
  <g>
    <rect x="24" y="144" width="712" height="40" rx="5" fill="#7aa2f7" fill-opacity=".10"/>
    <rect x="24" y="144" width="712" height="40" rx="5" fill="url(#film)"/>
    <rect x="24" y="144" width="712" height="40" rx="5" fill="none" stroke="#7aa2f7" stroke-opacity=".38"/>
    <rect x="24" y="144" width="4" height="40" fill="#7aa2f7"/>
    <text class="s" x="40" y="169" font-size="12" fill="#3d4854">V3</text>
    <text class="s" x="72" y="169" font-size="14" letter-spacing="1.3" fill="#7aa2f7">BACKEND</text>
    <text class="s" x="216" y="169" font-size="14.5" fill="#cfd9e3">Node.js/Express &#183; REST APIs &#183; Docker</text>
  </g>
  <g>
    <rect x="24" y="192" width="712" height="40" rx="5" fill="#35d0ba" fill-opacity=".10"/>
    <rect x="24" y="192" width="712" height="40" rx="5" fill="url(#film)"/>
    <rect x="24" y="192" width="712" height="40" rx="5" fill="none" stroke="#35d0ba" stroke-opacity=".38"/>
    <rect x="24" y="192" width="4" height="40" fill="#35d0ba"/>
    <text class="s" x="40" y="217" font-size="12" fill="#3d4854">V2</text>
    <text class="s" x="72" y="217" font-size="14" letter-spacing="1.3" fill="#35d0ba">FRONTEND</text>
    <text class="s" x="216" y="217" font-size="14.5" fill="#cfd9e3">React &#183; Next.js &#183; Tailwind CSS</text>
  </g>
  <g>
    <rect x="24" y="240" width="712" height="40" rx="5" fill="#f2a33c" fill-opacity=".10"/>
    <rect x="24" y="240" width="712" height="40" rx="5" fill="url(#film)"/>
    <rect x="24" y="240" width="712" height="40" rx="5" fill="none" stroke="#f2a33c" stroke-opacity=".38"/>
    <rect x="24" y="240" width="4" height="40" fill="#f2a33c"/>
    <text class="s" x="40" y="265" font-size="12" fill="#3d4854">V1</text>
    <text class="s" x="72" y="265" font-size="14" letter-spacing="1.3" fill="#f2a33c">LANGUAGES</text>
    <text class="s" x="216" y="265" font-size="14.5" fill="#cfd9e3">Java &#183; Python &#183; TypeScript &#183; C++ &#183; SQL</text>
  </g>
  <g>
    <rect x="24" y="288" width="712" height="40" rx="5" fill="#9ece6a" fill-opacity=".10"/>
    <rect x="24" y="288" width="712" height="40" rx="5" fill="url(#film)"/>
    <rect x="24" y="288" width="712" height="40" rx="5" fill="none" stroke="#9ece6a" stroke-opacity=".38"/>
    <rect x="24" y="288" width="4" height="40" fill="#9ece6a"/>
    <text class="s" x="40" y="313" font-size="12" fill="#3d4854">A1</text>
    <text class="s" x="72" y="313" font-size="14" letter-spacing="1.3" fill="#9ece6a">TOOLS</text>
    <text class="s" x="216" y="313" font-size="14.5" fill="#cfd9e3">Git &#183; Linux &#183; OpenCV &#183; FFmpeg</text>
  </g>
  <g clip-path="inset(0 round 12px)"><rect class="pz" x="0" y="0" width="140" height="344" fill="url(#pg)"/></g>
